<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Masoumeh Nouranian</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="contact-page">

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Contact Me</h1>
      <p class="contact-intro">
        Have a project in mind or want to connect? Send me a message.
      </p>

      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your full name"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message here..."
            required
          ></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <div class="social-links">
        <a href="https://github.com/masinooran96" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:masinooran96@gmail.com">Email</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Masoumeh Nouranian</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
