<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Masoumeh Nouranian</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation bar -->
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <main class="contact-page">
    <h1 class="section-title">Get in Touch</h1>
    <p class="section-subtitle">Feel free to reach out for collaborations or questions!</p>

    <div class="contact-container">
      <!-- Form using Formspree -->
      <form action="https://formspree.io/f/YOUR_EMAIL@gmail.com" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your Name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="Your Email" />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Masoumeh Nouranian. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
